<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Taviraj:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --shell-bg:#F6F1F3;
  --shell-surface:#FFFFFF;
  --shell-surface-2:#EFE6EA;
  --shell-border:#E1D5DB;
  --shell-ink:#241A20;
  --shell-ink-2:#5B4B52;
  --shell-muted:#8C7B82;
  --accent:#990066;
  --accent-dark:#7A0052;
  --accent-soft:#F3E3EC;
  --ok:#2E7D53;
  --ok-soft:#E4F3EA;
  --danger:#B3261E;
  --danger-soft:#FBE7E5;
  --focus:#7A0052;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --shell-bg:#181215;
    --shell-surface:#211A1E;
    --shell-surface-2:#2A2126;
    --shell-border:#3A2E34;
    --shell-ink:#F3EAEE;
    --shell-ink-2:#CBB9C2;
    --shell-muted:#96838C;
    --accent:#E85CB0;
    --accent-dark:#F080C4;
    --accent-soft:#3A2130;
    --ok:#6FCF9A;
    --ok-soft:#1C3327;
    --danger:#F29A94;
    --danger-soft:#3A2320;
    --focus:#E85CB0;
  }
}
:root[data-theme="dark"]{
  --shell-bg:#181215;
  --shell-surface:#211A1E;
  --shell-surface-2:#2A2126;
  --shell-border:#3A2E34;
  --shell-ink:#F3EAEE;
  --shell-ink-2:#CBB9C2;
  --shell-muted:#96838C;
  --accent:#E85CB0;
  --accent-dark:#F080C4;
  --accent-soft:#3A2130;
  --ok:#6FCF9A;
  --ok-soft:#1C3327;
  --danger:#F29A94;
  --danger-soft:#3A2320;
  --focus:#E85CB0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--shell-bg);
  color:var(--shell-ink);
  font-family:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 56px}

.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.masthead h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.masthead .sub{margin-top:4px;font-size:13px;color:var(--shell-ink-2)}
.wordmark{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wordmark .name{font-family:"Taviraj",Sarabun,serif;font-weight:600;font-size:19px;color:var(--shell-ink);letter-spacing:.005em}
.wordmark .desc{font-size:12.5px;color:var(--shell-muted);border-left:1px solid var(--shell-border);padding-left:10px}

.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--shell-ink-2);cursor:pointer;user-select:none}
.toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--shell-surface-2);border:1px solid var(--shell-border);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--shell-muted);transition:transform .15s}
.toggle input{display:none}
.toggle input:checked + .sw{background:var(--accent)}
.toggle input:checked + .sw::after{transform:translateX(14px);background:white}
.ghost-btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--shell-border);background:var(--shell-surface);color:var(--shell-ink-2);font-size:12.5px;font-weight:600;cursor:pointer}
.ghost-btn:hover{border-color:var(--accent)}

.rail-outer{overflow-x:auto;padding-bottom:6px;margin-bottom:20px;-webkit-overflow-scrolling:touch}
.rail{display:flex;align-items:flex-start;min-width:640px}
.rail-node{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;min-width:76px}
.rail-node .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:"IBM Plex Mono",monospace;background:var(--shell-surface-2);color:var(--shell-muted);border:1.5px solid var(--shell-border);z-index:1;flex-shrink:0;padding:0}
.rail-node .lbl{margin-top:7px;font-size:10.5px;color:var(--shell-muted);text-align:center;line-height:1.35;max-width:88px}
.rail-node .line{position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--shell-border);z-index:0}
.rail-node:last-child .line{display:none}
.rail-node.done .dot{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent);cursor:pointer}
.rail-node.done .line{background:var(--accent)}
.rail-node.done .lbl{color:var(--shell-ink-2)}
.rail-node.active .dot{background:var(--accent-dark);color:white;border-color:var(--accent-dark)}
.rail-node.active .lbl{color:var(--shell-ink);font-weight:700}

.stage-layout{display:flex;gap:22px;align-items:flex-start}
.stage-col{flex:1;min-width:0}
.stage-outer{width:100%;overflow:hidden;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.06), 0 12px 32px -18px rgba(122,0,82,.35);border:1px solid var(--shell-border)}
.stage-scaler{transform-origin:top left}
.stage{width:1280px;background:var(--app-bg);font-family:"Sarabun","Noto Sans Thai",sans-serif}

.explain-col{width:300px;flex-shrink:0}
@media (max-width:900px){
  .stage-layout{flex-direction:column}
  .stage-col{width:100%}
  .explain-col{width:100%}
}
.explain-card{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:18px 20px;position:sticky;top:16px;overflow-wrap:anywhere;min-width:0}
.explain-card .tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);font-family:"IBM Plex Mono",monospace}
.explain-card h3{font-size:15px;margin:8px 0 6px;color:var(--shell-ink)}
.explain-card p{font-size:13px;line-height:1.65;color:var(--shell-ink-2);margin:0}
.explain-card .why{margin-top:10px;padding-top:10px;border-top:1px solid rgba(122,0,82,.18);font-size:12px;color:var(--shell-ink-2);line-height:1.6}

.egfr-meter{display:flex;flex-direction:column;gap:5px}
.egfr-meter .bar{position:relative;height:14px;border-radius:7px;overflow:hidden;display:flex}
.egfr-meter .zone{height:100%}
.egfr-meter .marker{position:absolute;top:-4px;width:2px;height:22px;background:var(--shell-ink);transform:translateX(-1px)}
.egfr-meter .zlabels{display:flex;font-size:10px;color:var(--shell-muted);font-family:"IBM Plex Mono",monospace}

/* ===== inner app screen (fixed, product's own visual system regardless of viewer theme) ===== */
.stage{
  --ink:#1C1C1C;--ink-2:#4A4A4A;--muted:#8A8A8A;
  --bg:#F9F9F9;--card:#FFFFFF;--line:#E3E3E3;
  --acc:#990066;--acc-d:#7A0052;--acc-soft:#F3E3EC;--muted-soft:#F1F1F1;
  --hi:#B3261E;--hi-soft:#FBE7E5;--hi-line:#EFC7C3;
  --ok2:#2E7D53;--ok-soft2:#E4F3EA;--ok-line2:#BFE3CC;
  --warn:#95590A;--warn-soft:#FBEEDA;--warn-line:#EFD6A6;
  color:var(--ink);
}
.stage .topbar{height:60px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.stage .brand{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700}
.stage .crumb{color:var(--muted);font-size:13px;font-weight:400}
.stage .steps5{display:flex;gap:5px}
.stage .steps5 span{height:28px;padding:0 12px;border-radius:14px;font-size:11.5px;display:flex;align-items:center;background:var(--muted-soft);color:var(--muted)}
.stage .steps5 span.on{background:var(--acc-d);color:#fff;font-weight:700}
.stage .who{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:16px}
.stage .who .av{width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.stage .who .name{font-size:12px;font-weight:700}
.stage .who .role{font-size:10.5px;color:var(--muted)}

.stage .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.stage .lbl{font-size:12px;color:var(--ink-2);font-weight:600;display:block;margin-bottom:5px}
.stage .fld{width:100%;height:40px;border:1px solid var(--line);border-radius:7px;padding:0 12px;font-size:13.5px;font-family:"Sarabun",sans-serif;color:var(--ink);background:#fff}
.stage .fld:disabled,.stage .fld[readonly]{background:var(--muted-soft);color:var(--ink-2)}
.stage textarea.fld{height:64px;resize:none;padding:10px 12px;font-family:"Sarabun",sans-serif}
.stage select.fld{background:#fff}
.stage .seg{display:flex;gap:6px}
.stage .seg .opt{flex:1;min-height:38px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);cursor:pointer;text-align:center;padding:4px 6px;line-height:1.3;background:#fff}
.stage .seg .opt.on{border:1.5px solid var(--acc);background:var(--acc-soft);color:var(--acc-d);font-weight:700}
.stage .sec-title{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.stage .sec-num{width:19px;height:19px;border-radius:50%;background:var(--acc-d);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stage .btn{height:46px;border:none;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:"Sarabun",sans-serif}
.stage .btn:disabled{opacity:.45;cursor:not-allowed}
.stage .btn-p{background:var(--acc-d);color:#fff}
.stage .btn-s{height:40px;background:#fff;color:var(--ink-2);border:1px solid var(--line);font-size:12.5px;border-radius:9px;cursor:pointer;font-family:"Sarabun",sans-serif}
.stage .pill{font-size:11px;padding:4px 10px;border-radius:11px;font-weight:700}
.stage .chk-row{display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:9px;cursor:pointer}
.stage .chk-box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.stage .chk-box.on{background:var(--acc-d);border-color:var(--acc-d)}
.stage .note{font-size:11px;color:var(--muted);line-height:1.6}
.stage .err{font-size:12px;color:var(--hi);font-weight:600;margin-top:2px}
.stage table.plist{width:100%;border-collapse:collapse;font-size:13px}
.stage table.plist th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:10px 14px;background:var(--muted-soft);border-bottom:1px solid var(--line)}
.stage table.plist td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.stage table.plist tr:last-child td{border-bottom:none}
</style>

<div class="wrap">
  <div class="masthead">
    <div>
      <div class="wordmark"><span class="name">T-POSE Corp</span><span class="desc">MALA Risk Screening</span></div>
    </div>
    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="explainToggle" checked onchange="setExplain(this.checked)">
        <span class="sw"></span>
        โหมดอธิบาย
      </label>
      <button class="ghost-btn" onclick="restart()">↺ เริ่มใหม่</button>

<script>
const RAIL_LABELS = ['เกริ่นนำ','เข้าสู่ระบบ','ค้นหา / เพิ่มผู้ป่วย','แบบประเมิน','ผลประเมิน','แจ้งเตือน / คำแนะนำ','ยืนยันปิดเคส','สรุป'];

const PATIENTS = {
  p1: {id:'p1', name:'นาง สมหญิง จ.', hn:'67-014822', sex:'หญิง', age:68, dm:'เบาหวานชนิดที่ 2', weight:52.0, height:158, egfr:38, egfrDate:'12 มิ.ย. 2569', dose:2000, alcohol:'occasional', tr:{vomit:true, intake:false, nsaid:false, herb:false}, isNew:false, statusTag:{text:'ยังไม่คัดกรองเดือนนี้', kind:'warn'}},
  p2: {id:'p2', name:'นาง ทองสุข ว.', hn:'67-021355', sex:'หญิง', age:61, dm:'เบาหวานชนิดที่ 2', weight:63.0, height:160, egfr:68, egfrDate:'2 ก.ค. 2569', dose:1000, alcohol:'none', tr:{vomit:true, intake:false, nsaid:false, herb:false}, isNew:false, statusTag:{text:'ไม่เสี่ยง', kind:'ok'}},
  p4: {id:'p4', name:'นาย สมชาย ก.', hn:'67-018204', sex:'ชาย', age:70, dm:'เบาหวานชนิดที่ 2', weight:65.0, height:165, egfr:82, egfrDate:'20 ส.ค. 2569', dose:1000, alcohol:'none', tr:{vomit:false, intake:false, nsaid:false, herb:false}, isNew:false, statusTag:{text:'ยังไม่คัดกรองเดือนนี้', kind:'warn'}},
  p3: {id:'p3', name:'นาย ประยูร ส.', hn:'67-009117', sex:'ชาย', age:74, dm:'เบาหวานชนิดที่ 2', historyOnly:true, statusTag:{text:'เสี่ยงมาก (ส่งต่อรพ แล้ว)', kind:'hi'}},
  p5: {id:'p5', name:'นาง บัวลอย พ.', hn:null, sex:'หญิง', age:65, dm:'เบาหวานชนิดที่ 2', isNew:true, statusTag:{text:'รอ HN จาก รพ. (เพิ่มใหม่)', kind:'muted'}}
};
const PATIENT_ORDER = ['p1','p3','p2','p4','p5'];

const state = {
  phase:'intro',
  explain:true,
  facility:'รพ.สต.บ้านดู่',
  role:'พยาบาล',
  patient:null,
  form:null,
  result:null,
  ackAdvice:false,
  ackConfirm:false,
  confirmNote:'',
  historyNoteOpen:false,
  search:'',
  err:''
};

function railIndex(phase){
  return {intro:0, login:1, search:2, addPatient:2, riskform:3, result:4, referral:5, recommendation:5, confirm:6, done:7}[phase] ?? 0;
}

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ return (s===null||s===undefined) ? '' : String(s); }

function maxDoseForEgfr(egfr){
  if(egfr===null || egfr===undefined || egfr==='') return null;
  if(egfr < 30) return 0;
  if(egfr < 45) return 1000;
  return 2000;
}
function bmiOf(f){
  if(!f || !f.weight || !f.height) return null;
  const h = f.height/100;
  return f.weight / (h*h);
}
function alcoholScore(a){ return a==='heavy'?2 : a==='regular'?1 : 0; }
function roleTitle(r){ return {'พยาบาล':'พยาบาลวิชาชีพ','เภสัชกร':'เภสัชกร','แพทย์':'แพทย์'}[r] || r; }
function alcoholLabel(a){
  return {none:'ไม่ดื่มเลย', occasional:'ดื่มเป็นครั้งคราว (≤1 ครั้ง/สัปดาห์)', regular:'ดื่มประจำ (≥3 ครั้ง/สัปดาห์)', heavy:'ดื่มหนัก (≥5 แก้ว/ครั้ง)'}[a] || a;
}

function computeResult(f){
  const bmi = bmiOf(f);
  const maxDose = maxDoseForEgfr(f.egfr);
  const doseOk = maxDose!==null && maxDose>0 && f.dose!==null && f.dose<=maxDose;
  const sEgfr = (f.egfr!==null && f.egfr<60) ? 1:0;
  const sBmi = (bmi!==null && bmi<23) ? 2:0;
  const sAlc = alcoholScore(f.alcohol);
  const score = sEgfr+sBmi+sAlc;
  const triggerList = [
    {key:'vomit', label:'อาเจียนหรือท้องเสียในช่วงที่ผ่านมา', on:!!f.tr.vomit},
    {key:'intake', label:'ทานอาหารได้น้อยลงต่อเนื่อง 1–2 วัน', on:!!f.tr.intake},
    {key:'nsaid', label:'กินยาแก้ปวด/แก้อักเสบ (NSAIDs) หรือยาชุด', on:!!f.tr.nsaid},
    {key:'herb', label:'กินยาต้ม ยาหม้อ สมุนไพร หรืออาหารเสริม', on:!!f.tr.herb}
  ];
  const triggerCount = triggerList.filter(t=>t.on).length;
  const isAlert = !doseOk || score>=2;
  return {bmi, maxDose, doseOk, sEgfr, sBmi, sAlc, score, triggerList, triggerCount, isAlert};
}

function setExplain(v){ state.explain=v; render(); }

function restart(){
  state.phase='intro'; state.patient=null; state.form=null; state.result=null;
  state.ackAdvice=false; state.ackConfirm=false; state.confirmNote=''; state.search=''; state.err='';
  render();
}

function goPhase(p){ state.phase=p; state.err=''; render(); }

function jumpRail(i){
  const cur = railIndex(state.phase);
  if(i>cur) return;
  const map = {0:'intro',1:'login',2:'search',3:'riskform',4:'result',5: state.result ? (state.result.isAlert?'referral':'recommendation') : 'result', 6:'confirm', 7:'done'};
  if(i===5 && !state.result) return;
  if(i>=3 && !state.form) return;
  goPhase(map[i]);
}

function doLogin(){ goPhase('search'); }

function selectPatient(id){
  const p = PATIENTS[id];
  if(p.historyOnly){ state.historyNoteOpen = state.historyNoteOpen===id ? false : id; render(); return; }
  if(p.isNew){ goPhase('addPatient'); return; }
  state.patient = p;
  state.form = {
    weight:p.weight, height:p.height, egfr:p.egfr, egfrDate:p.egfrDate, dose:p.dose,
    alcohol:p.alcohol, tr:{...p.tr}
  };
  state.err='';
  goPhase('riskform');
}

function submitAddPatient(){
  const name = document.getElementById('npName').value.trim() || PATIENTS.p5.name;
  const sex = document.getElementById('npSex').value;
  const dob = document.getElementById('npDob').value.trim();
  const hn = document.getElementById('npHn').value.trim();
  if(!dob){ state.err='กรุณากรอกวันเกิด เพื่อกันจับคู่ผู้ป่วยผิดคน'; render(); return; }
  state.patient = {id:'p5new', name, hn: hn||null, sex, age:'—', dm:'เบาหวานชนิดที่ 2', isNew:true};
  state.form = {weight:null, height:null, egfr:null, egfrDate:null, dose:null, alcohol:'none', tr:{vomit:false,intake:false,nsaid:false,herb:false}};
  state.err='';
  goPhase('riskform');
}

function updateForm(field, val){
  if(field==='weight' || field==='height' || field==='dose' || field==='egfr'){
    state.form[field] = val===''? null : Number(val);
  } else {
    state.form[field] = val;
  }
  if(field==='weight' || field==='height'){
    const el = document.getElementById('bmi-val');
    if(el){ const bmi = bmiOf(state.form); el.textContent = bmi? bmi.toFixed(1)+' kg/m²' : '—'; }
  } else if(field==='egfr'){
    const el = document.getElementById('egfr-meter-slot');
    if(el){ el.innerHTML = state.form.egfr!==null? egfrMeter(state.form.egfr,{caption:'ตำแหน่ง eGFR ของผู้ป่วยรายนี้บนมิเตอร์'}) : ''; }
  }
  requestAnimationFrame(fitStage);
}
function setAlcohol(v){ state.form.alcohol=v; render(); }
function setTrigger(k, v){ state.form.tr[k]=v; render(); }

function submitRiskForm(){
  const f = state.form;
  if(f.weight===null || f.height===null || f.egfr===null || f.dose===null){
    state.err='กรุณากรอกให้ครบ: น้ำหนัก ส่วนสูง eGFR และขนาดยา ก่อนประมวลผล';
    render(); return;
  }
  state.err='';
  state.result = computeResult(f);
  goPhase('result');
}

function proceedFromResult(){ goPhase(state.result.isAlert ? 'referral' : 'recommendation'); }
function toggleAckAdvice(){ state.ackAdvice=!state.ackAdvice; render(); }
function toggleAckConfirm(){ state.ackConfirm=!state.ackConfirm; render(); }
function updateNote(v){ state.confirmNote=v; }
function submitConfirm(){ goPhase('done'); }

/* ---------- eGFR meter ---------- */
function egfrMeter(value, opts){
  opts = opts||{};
  const zones = [
    {min:0, max:30, color:'#B3261E', label:'<30'},
    {min:30, max:45, color:'#C97A1E', label:'30–44'},
    {min:45, max:60, color:'#C9B21E', label:'45–59'},
    {min:60, max:120, color:'#2E7D53', label:'≥60'}
  ];
  const total = 120;
  const bars = zones.map(z=>`<div class="zone" style="width:${(z.max-z.min)/total*100}%;background:${z.color}"></div>`).join('');
  const pct = value===null||value===undefined ? null : Math.max(0,Math.min(100, value/total*100));
  const marker = pct===null ? '' : `<div class="marker" style="left:${pct}%"></div>`;
  const zlabels = zones.map(z=>`<span style="width:${(z.max-z.min)/total*100}%;text-align:center">${z.label}</span>`).join('');
  return `<div class="egfr-meter"><div class="bar">${bars}${marker}</div><div class="zlabels">${zlabels}</div>${opts.caption? `<div style="font-size:11px;color:var(--shell-muted)">${opts.caption}</div>`:''}</div>`;
}

  if(r.triggerList.find(t=>t.key==='nsaid'&&t.on)) specific.push('เลี่ยงยาแก้ปวดกลุ่ม NSAIDs ช่วงนี้ ใช้พาราเซตามอลแทนถ้าเลี่ยงได้');

  const lines = specific.length? [...specific, ...baseline] : ['ไม่พบปัจจัยกระตุ้นเพิ่มเติมในแบบประเมินนี้ ให้คำแนะนำทั่วไปเพื่อป้องกันไว้ก่อน', ...baseline];

      <div class="card" style="padding:13px 18px;border-left:4px solid var(--ok2);display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:13px"><b>${state.patient.name}</b> <span style="color:var(--muted)">· HN ${state.patient.hn||'—'}</span></div>
        <span class="pill" style="background:var(--muted-soft);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok2);flex-shrink:0"></span>ไม่แจ้งเตือน (No Alert)</span>
      </div>
      <div class="card" style="background:var(--ok-soft2);border-color:var(--ok-line2);padding:26px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--ok2);display:flex;align-items:center;justify-content:center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div style="font-size:17px;font-weight:700">สร้างคำแนะนำให้ผู้ป่วยแล้ว</div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px">${facts.map(x=>`<span style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink-2)">${x}</span>`).join('')}</div>
      </div>
      <div class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13.5px;font-weight:700">คำแนะนำสำหรับผู้ป่วย (Sick Day Rules)</div>
          <span style="font-size:10.5px;padding:3px 9px;border-radius:10px;background:var(--acc-soft);color:var(--acc-d);font-weight:700">AI GENERATED</span></div>
        <div style="background:var(--muted-soft);border-radius:9px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.7">
          ${lines.map(l=>`<div style="display:flex;gap:7px"><span style="color:var(--acc-d);font-weight:700">·</span>${l}</div>`).join('')}
        </div>
        <div class="note">สังเคราะห์จากปัจจัยที่พบในแบบประเมิน อ้างอิง Sick Day Rules ที่ทีมแพทย์กำหนดไว้ล่วงหน้า</div>
      </div>
      <div class="chk-row" style="background:var(--muted-soft)" role="checkbox" aria-checked="${state.ackAdvice}" tabindex="0" onclick="toggleAckAdvice()">
        <div class="chk-box${state.ackAdvice?' on':''}" style="border-color:var(--ok2)${state.ackAdvice?';background:var(--ok2)':''}">${state.ackAdvice?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>
        <span style="font-size:12.5px;color:var(--ink-2)">ข้าพเจ้าได้แจ้งคำแนะนำนี้ให้ผู้ป่วยรับทราบแล้ว</span>
      </div>
      <button class="btn btn-p" ${state.ackAdvice?'':'disabled'} onclick="goPhase('confirm')">ดำเนินการต่อ</button>
    </div>
  </div>`;
}

function screenConfirm(){
  const isAlert = state.result.isAlert;
  const tierLabel = isAlert?'แจ้งเตือนแล้ว (Alert)':'ไม่แจ้งเตือน (No Alert)';
  const tierBg = isAlert?'var(--hi-soft)':'var(--ok-soft2)', tierFg=isAlert?'var(--hi)':'var(--ok2)';
  const summaryLine = isAlert? 'แจ้งเตือนโรงพยาบาลแม่ข่าย (แอป + LINE) แล้ว':'แจ้งคำแนะนำ Sick Day Rules ให้ผู้ป่วยแล้ว';
  const summaryDetail = isAlert? 'แพทย์/พยาบาลที่ รพ. รับดูแลผู้ป่วยต่อโดยตรง การยืนยันนี้เป็นเพียงการปิดเคสในระบบของหน่วยบริการปฐมภูมิ':'ไม่เข้าเกณฑ์แจ้งเตือน หน้างานแจ้งผู้ป่วยเองทันที ไม่มีแพทย์เกี่ยวข้องในขั้นตอนนี้';
  const defaultNote = isAlert? 'ผู้ป่วยมีอาการท้องเสียตั้งแต่ 3 วันก่อน แจ้งเตือน รพ. พร้อมญาตินำส่งภายในวันนี้':'แจ้งผู้ป่วยและญาติเรื่อง Sick Day Rules แล้ว นัดตรวจ eGFR ซ้ำตามรอบปกติ';
  if(!state.confirmNote) state.confirmNote = defaultNote;
  return `${screenTopbar(4)}
  <div style="padding:22px 28px;display:flex;justify-content:center">
    <div style="width:520px;display:flex;flex-direction:column;gap:14px">
      <div class="card" style="padding:13px 18px;border-left:4px solid ${tierFg};display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:13px"><b>${state.patient.name}</b> <span style="color:var(--muted)">· HN ${state.patient.hn||'—'}</span></div>
        <span class="pill" style="background:var(--muted-soft);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:${tierFg};flex-shrink:0"></span>${tierLabel}</span>
      </div>
      <div class="card" style="padding:18px 20px;display:flex;flex-direction:column;gap:9px">
        <div style="font-size:13.5px;font-weight:700">สรุปสิ่งที่ดำเนินการแล้ว</div>
        <div style="display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid ${isAlert?'var(--hi-line)':'var(--ok-line2)'};background:${tierBg};border-radius:9px">
          <div style="width:15px;height:15px;border-radius:50%;background:${tierFg};display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <span style="font-size:12.5px;font-weight:700;color:${tierFg}">${summaryLine}</span>
        </div>
        <div style="font-size:12px;color:var(--ink-2);line-height:1.6">${summaryDetail}</div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:2px">
          <label class="lbl">หมายเหตุเพิ่มเติม</label>
          <textarea class="fld" oninput="updateNote(this.value)">${esc(state.confirmNote)}</textarea>
        </div>
      </div>
      <div class="card" style="background:var(--acc-soft);border-color:#D5A6BD;padding:16px 18px;display:flex;flex-direction:column;gap:9px">
        <div style="font-size:12px;font-weight:700;color:var(--acc-d)">การยืนยันผลการประเมิน (ลายมือชื่ออิเล็กทรอนิกส์)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
          <div><div style="color:var(--muted)">ผู้ยืนยัน</div><div style="font-weight:700;margin-top:2px">สมศรี ใจดี · ${roleTitle(state.role)}</div></div>
          <div><div style="color:var(--muted)">วัน–เวลา</div><div style="font-weight:700;margin-top:2px">8 ก.ย. 2569, 11:35 น.</div></div>
          <div><div style="color:var(--muted)">หน่วยบริการ</div><div style="font-weight:700;margin-top:2px">${esc(state.facility)}</div></div>
          <div><div style="color:var(--muted)">เวอร์ชันแบบประเมิน</div><div style="font-weight:700;margin-top:2px">v1.2 (draft)</div></div>
        </div>
        <div class="chk-row" style="padding:8px 0 0" role="checkbox" aria-checked="${state.ackConfirm}" tabindex="0" onclick="toggleAckConfirm()">
          <div class="chk-box${state.ackConfirm?' on':''}">${state.ackConfirm?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>
          <span style="font-size:12px;color:var(--ink-2)">ข้าพเจ้าขอยืนยันว่าข้อมูลและผลการประเมินนี้ถูกต้อง</span>
        </div>
      </div>
      <button class="btn btn-p" ${state.ackConfirm?'':'disabled'} onclick="submitConfirm()">ยืนยันและบันทึกการตัดสินใจ</button>
      <div class="note" style="text-align:center">การกดยืนยันถือเป็นการลงลายมือชื่ออิเล็กทรอนิกส์ตาม พ.ร.บ. ธุรกรรมทางอิเล็กทรอนิกส์ มาตรา 9</div>
    </div>
  </div>`;
}

function screenDone(){
  const isAlert = state.result.isAlert;
  return `<div style="min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:56px 60px;text-align:center">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--acc-d);display:flex;align-items:center;justify-content:center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div style="font-size:22px;font-weight:700">เคสของ ${state.patient.name} ปิดสมบูรณ์แล้ว</div>
    <div style="max-width:480px;font-size:14px;line-height:1.8;color:var(--ink-2)">
      เส้นทางที่เพิ่งเดินผ่าน: ล็อกอิน → ค้นหา/เพิ่มผู้ป่วย → กรอกแบบประเมิน 13 ข้อ → ระบบตัดสิน <b>${isAlert?'แจ้งเตือน (แดง)':'ไม่แจ้งเตือน (เขียว)'}</b> → ${isAlert?'ส่งต่อโรงพยาบาลทันที':'ให้คำแนะนำ Sick Day Rules ทันที'} → ยืนยันปิดเคส
    </div>
    <div style="max-width:480px;font-size:13.5px;line-height:1.8;color:var(--ink-2);background:var(--acc-soft);border-radius:10px;padding:16px 20px">
      ระบบนี้ทำสิ่งที่ไม่มีใครทำที่ รพ.สต. มาก่อน คือเช็คว่าไตของคนไข้ยังรับยาไหวไหม ก่อนที่จะสายเกินไปจนเกิด MALA แบบที่เจอใน <b>58%</b> ของเคสจริง
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-s" onclick="goPhase('search')">↺ เริ่มเคสใหม่ (ค้นหาผู้ป่วย)</button>
      <button class="btn btn-p" onclick="restart()">กลับหน้าแรก</button>
    </div>
  </div>`;
}

function render(){
  const active = document.activeElement;
  let focusId=null, selStart=null, selEnd=null;
  if(active && active.id && document.getElementById('stage').contains(active)){
    focusId = active.id;
    if(typeof active.selectionStart === 'number'){ try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){} }
  }

  document.getElementById('explainToggle').checked = state.explain;
  const rail = document.getElementById('rail');
  const cur = railIndex(state.phase);
  rail.innerHTML = RAIL_LABELS.map((lbl,i)=>{
    let cls = i===cur?'active': i<cur?'done':'';
    return `<div class="rail-node ${cls}"><div class="line"></div><button class="dot" onclick="jumpRail(${i})" aria-label="ไปที่ขั้นตอน ${lbl}">${i+1}</button><div class="lbl">${lbl}</div></div>`;
  }).join('');

  const stage = document.getElementById('stage');
  const fns = {intro:screenIntro, login:screenLogin, search:screenSearch, addPatient:screenAddPatient, riskform:screenRiskForm, result:screenResult, referral:screenReferral, recommendation:screenRecommendation, confirm:screenConfirm, done:screenDone};
  stage.innerHTML = fns[state.phase]();

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!==null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }

  const explainCol = document.getElementById('explainCol');
  if(state.explain){
    const c = CAPTIONS[state.phase];
    explainCol.style.display='';
    explainCol.innerHTML = `<div class="explain-card">
      <div class="tag">คำอธิบาย</div>
      <h3>${c.t}</h3>
      <p>${c.b}</p>
      <div class="why">${c.w}</div>
    </div>`;
  } else {
    explainCol.style.display='none';
  }

  requestAnimationFrame(fitStage);
}

function fitStage(){
  const outer = document.getElementById('stageOuter');
  const scaler = document.getElementById('stageScaler');
  const stage = document.getElementById('stage');
  const w = outer.clientWidth;
  const scale = Math.min(1, w/1280);
  scaler.style.transform = `scale(${scale})`;
  outer.style.height = (stage.offsetHeight*scale) + 'px';
}

try{
  const saved = localStorage.getItem('mala-journey-explain');
  if(saved!==null) state.explain = saved==='1';
}catch(e){}
const _setExplain = setExplain;
setExplain = function(v){ _setExplain(v); try{ localStorage.setItem('mala-journey-explain', v?'1':'0'); }catch(e){} };

render();
window.addEventListener('resize', ()=>{ clearTimeout(window.__rt); window.__rt=setTimeout(fitStage,80); });
document.addEventListener('keydown', (e)=>{
  const role = e.target.getAttribute && e.target.getAttribute('role');
  if((role==='radio' || role==='checkbox') && (e.key==='Enter' || e.key===' ')){
    e.preventDefault();
    e.target.click();
  }
});
</script>
